<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>کوین‌بازی ناز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Vazirmatn',sans-serif;color:#c2497e;background:#ffeaf3;
    overflow:hidden;height:100dvh;user-select:none;-webkit-user-select:none;overscroll-behavior:none;
  }
  img{-webkit-user-drag:none}

  /* ─── صحنه و پس‌زمینه (کامل می‌افته) ─── */
  #stage{position:fixed;inset:0;touch-action:none;cursor:none}
  #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  #bg.shake{animation:shk .16s linear}
  @keyframes shk{30%{translate:4px 3px}60%{translate:-4px -3px}100%{translate:0 0}}
  #stage.noimg #bg{display:none}
  #stage.noimg{background:repeating-linear-gradient(-45deg,#ffe4ef 0 28px,#ffd3e5 28px 56px)}
  #fx{position:absolute;inset:0;pointer-events:none;z-index:20}

  /* ─── شمارنده‌ی کوین ─── */
  #topbar{position:fixed;top:12px;inset-inline:0;display:flex;justify-content:center;z-index:30;pointer-events:none}
  #coinPill{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.85);
    backdrop-filter:blur(8px);border:2.5px solid #ffc2da;border-radius:99px;padding:6px 18px;
    box-shadow:0 4px 14px rgba(255,111,165,.25)}
  #coinPill svg{width:34px;height:34px;flex:none}
  #coinNum{font-size:24px;font-weight:900;color:#e0447c;min-width:44px;text-align:center;line-height:1.2}
  #coinPill.bump{animation:bump .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes bump{45%{scale:1.14}}

  /* ─── کوینی که موقع ضربه می‌پره ─── */
  .coinFly{position:absolute;translate:-50% -50%;display:flex;flex-direction:column;align-items:center;gap:1px;
    animation:flyUp .8s cubic-bezier(.22,.7,.35,1) forwards;z-index:25}
  .coinFly svg{width:36px;height:36px;filter:drop-shadow(0 3px 3px rgba(180,60,110,.3))}
  .coinFly span{font-size:15px;font-weight:900;color:#e0447c;text-shadow:0 1px 0 #fff}
  @keyframes flyUp{0%{opacity:0;translate:-50% -20%;scale:.3}20%{opacity:1;scale:1.12}100%{opacity:0;translate:-50% -190%;scale:1}}

  /* ─── افکت کوبیده شدن روی دیوار ─── */
  .impact{position:absolute;width:130px;height:130px;translate:-50% -50%;animation:impact .32s ease-out forwards}
  .impact svg{width:100%;height:100%}
  @keyframes impact{0%{scale:.25;opacity:1}55%{scale:1.05;opacity:1}100%{scale:1.3;opacity:0}}
  .dust{position:absolute;width:11px;height:11px;margin:-5.5px;border-radius:50%;
    background:#fff;box-shadow:0 0 0 2px rgba(255,182,210,.6);opacity:.95;animation:dust .55s ease-out forwards}
  .dust.pk{background:#ffd3e5;box-shadow:none}
  @keyframes dust{to{translate:var(--dx) var(--dy);scale:.2;opacity:0}}

  /* ─── نوار ابزارها ─── */
  #dock{position:fixed;bottom:14px;inset-inline:0;display:flex;justify-content:center;z-index:30;
    padding:0 10px;pointer-events:none}
  #dockInner{display:flex;gap:12px;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);
    border:2.5px solid #ffc2da;border-radius:26px;padding:12px 14px 9px;
    box-shadow:0 6px 18px rgba(255,111,165,.28);max-width:100%;overflow-x:auto;touch-action:pan-x;pointer-events:auto}
  .tool{background:none;border:none;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;
    align-items:center;gap:4px;transition:transform .18s cubic-bezier(.34,1.56,.64,1);touch-action:manipulation}
  .tool .frame{width:88px;height:88px;background:#fff;border:2.5px solid #ffb9d4;border-radius:24px;
    display:grid;place-items:center;overflow:hidden;transition:border-color .15s,background .15s,box-shadow .15s}
  .tool .frame img{width:90%;height:90%;object-fit:contain}
  .tool .frame .ph{display:none;font-style:normal;font-size:13px;font-weight:800;color:#e88ab4;text-align:center;padding:4px;line-height:1.5}
  .tool.noimg .frame img{display:none}
  .tool.noimg .frame .ph{display:block}
  .tool .tname{font-size:13px;font-weight:800;color:#d0689a}
  .tool.sel{transform:translateY(-8px)}
  .tool.sel .frame{background:#ffe3ef;border-color:#ff5c9d;box-shadow:0 5px 0 #ff9cc3}
  .tool.sel .tname{color:#e0447c}
  .tool:active .frame{translate:0 2px}

  /* ─── عکس ابزار که دنبال دست میاد ─── */
  #tool{position:fixed;left:0;top:0;width:130px;height:130px;margin:-65px;pointer-events:none;z-index:40;
    opacity:0;transition:opacity .15s;will-change:transform}
  #tool.on{opacity:1}
  #tool .inner{width:100%;height:100%;transform-origin:50% 82%;filter:drop-shadow(0 10px 7px rgba(180,60,110,.35))}
  #tool .inner img{width:100%;height:100%;object-fit:contain;display:block}
  #tool .inner .ph{display:none;align-items:center;justify-content:center;width:100%;height:100%;
    background:#fff;border:3px solid #ff9cc3;border-radius:22px;font-size:15px;font-weight:800;color:#e0447c;text-align:center;padding:6px}
  #tool.broken .inner img{display:none}
  #tool.broken .inner .ph{display:flex}

  /* ─── انیمیشن ضربه: کوبیدن مثل میخ توی دیوار ─── */
  #tool .inner.hit{animation:slam .36s cubic-bezier(.3,.7,.4,1)}
  @keyframes slam{
    0%  {transform:translateY(-18px) rotate(-16deg) scale(1)}
    36% {transform:translateY(32px)  rotate(7deg)   scale(1.16,.76)}
    52% {transform:translateY(28px)  rotate(4deg)   scale(1.28,.66)}
    72% {transform:translateY(-6px)  rotate(-5deg)  scale(.94,1.07)}
    100%{transform:translateY(0)     rotate(0)      scale(1)}
  }

  #imgNote{position:fixed;top:64px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;pointer-events:none;
    background:rgba(255,255,255,.9);border:2px dashed #ff9cc3;color:#d0689a;font-size:12px;font-weight:700;
    padding:7px 16px;border-radius:12px;z-index:30;text-align:center}

  @media (max-width:520px){
    #tool{width:94px;height:94px;margin:-47px}
    .tool .frame{width:66px;height:66px;border-radius:19px}
    .tool .frame .ph{font-size:11px}
    #coinNum{font-size:20px}
    #coinPill svg{width:28px;height:28px}
    #dockInner{gap:8px;padding:9px 10px 7px}
  }
</style>
</head>
<body>

<div id="stage">
  <img id="bg" src="1.jpg" alt="" draggable="false">
  <div id="fx"></div>
</div>

<div id="topbar">
  <div id="coinPill">
    <span id="coinIcon"></span>
    <b id="coinNum">۰</b>
  </div>
</div>

<div id="imgNote" hidden>عکس «1.jpg» رو کنار همین فایل بذار تا پس‌زمینه کامل بیفته</div>

<nav id="dock"><div id="dockInner"></div></nav>

<div id="tool"><div class="inner" id="toolInner"><img id="toolImg" alt="" draggable="false"><div class="ph" id="toolPh"></div></div></div>

<script>
'use strict';

/* آیکون کوین (سکه‌ی قلب‌دار) */
const COIN_SVG = `<svg viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="27.5" fill="#ffd45c" stroke="#e8a13a" stroke-width="5"/>
  <circle cx="32" cy="32" r="19.5" fill="none" stroke="#f2b13f" stroke-width="3"/>
  <path d="M32 41.5C26 37.2 21.8 33.4 21.8 28.9a6 6 0 0 1 10.2-4.2A6 6 0 0 1 42.2 28.9c0 4.5-4.2 8.3-10.2 12.6Z" fill="#e8a13a"/>
</svg>`;

/* نام پوشه‌ی عکس ابزارها */
const FOLDER = 'tools';
const TOOLS = [
  {file:'hammer',  name:'چکش'},
  {file:'bat',     name:'باتوم'},
  {file:'bunny',   name:'گوش‌خرگوشی'},
  {file:'swatter', name:'مگس‌کش'},
  {file:'whip',    name:'شلاق'},
];

const $ = s => document.querySelector(s);
const fa = n => Number(n).toLocaleString('fa-IR');

const stage=$('#stage'), fx=$('#fx'), bg=$('#bg'), dockInner=$('#dockInner'),
      tool=$('#tool'), toolInner=$('#toolInner'), toolImg=$('#toolImg'), toolPh=$('#toolPh'),
      coinPill=$('#coinPill'), coinNum=$('#coinNum'), coinIcon=$('#coinIcon');

coinIcon.innerHTML = COIN_SVG;

let coins=0, sel=0;

/* ساخت دکمه‌های ابزار از روی عکس‌های پوشه */
TOOLS.forEach((t,i)=>{
  const b=document.createElement('button');
  b.className='tool';
  b.innerHTML=`<span class="frame"><img src="${FOLDER}/${t.file}.png" alt="" draggable="false"><i class="ph">${t.name}</i></span><span class="tname">${t.name}</span>`;
  b.querySelector('img').addEventListener('error',()=>{
    t.broken=true; b.classList.add('noimg');
    if(i===sel) renderCursor();
  });
  b.addEventListener('click',()=>selectTool(i));
  dockInner.append(b);
});

function selectTool(i){
  sel=i;
  [...dockInner.children].forEach((b,j)=>b.classList.toggle('sel',j===i));
  renderCursor();
}
function renderCursor(){
  const t=TOOLS[sel];
  if(t.broken){ tool.classList.add('broken'); toolPh.textContent=t.name; }
  else{
    tool.classList.remove('broken');
    toolImg.onerror=()=>{ t.broken=true; renderCursor(); };
    toolImg.src=`${FOLDER}/${t.file}.png`;
  }
}
selectTool(0);

/* دنبال کردن نشانگر با عکس ابزار */
let tx=innerWidth/2, ty=innerHeight/2, cx=tx, cy=ty, touchTimer=0;

stage.addEventListener('pointermove',e=>{
  tx=e.clientX; ty=e.clientY;
  if(e.pointerType!=='touch') tool.classList.add('on');
});
stage.addEventListener('pointerleave',e=>{
  if(e.pointerType!=='touch') tool.classList.remove('on');
});
stage.addEventListener('contextmenu',e=>e.preventDefault());

stage.addEventListener('pointerdown',e=>{
  tx=e.clientX; ty=e.clientY;
  if(e.pointerType==='touch'){
    cx=tx; cy=ty;
    tool.style.transform=`translate(${cx}px,${cy}px)`;
    tool.classList.add('on');
    clearTimeout(touchTimer);
    touchTimer=setTimeout(()=>tool.classList.remove('on'),520);
  }

  /* کوبیده شدن ابزار روی دیوار */
  toolInner.classList.remove('hit'); void toolInner.offsetWidth; toolInner.classList.add('hit');
  impact(e.clientX,e.clientY);

  /* لرزش خفیف دیوار موقع کوبیدن */
  bg.classList.remove('shake'); void bg.offsetWidth; bg.classList.add('shake');

  /* کوین! */
  coins++;
  coinNum.textContent=fa(coins);
  coinPill.classList.remove('bump'); void coinPill.offsetWidth; coinPill.classList.add('bump');
  coinFly(e.clientX,e.clientY);
});

(function loop(){
  cx+=(tx-cx)*.35; cy+=(ty-cy)*.35;
  const tilt=Math.max(-16,Math.min(16,(tx-cx)*.5));
  tool.style.transform=`translate(${cx}px,${cy}px) rotate(${tilt}deg)`;
  requestAnimationFrame(loop);
})();

/* افکت برخورد: خطوط ضربه + گرد و خاک */
function impact(x,y){
  const d=document.createElement('div');
  d.className='impact';
  d.innerHTML=`<svg viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" style="filter:drop-shadow(0 2px 0 rgba(224,68,124,.4))">
    <line x1="60" y1="6"  x2="60" y2="32"/><line x1="60" y1="88" x2="60" y2="114"/>
    <line x1="6"  y1="60" x2="32" y2="60"/><line x1="88" y1="60" x2="114" y2="60"/>
    <line x1="22" y1="22" x2="41" y2="41"/><line x1="79" y1="79" x2="98" y2="98"/>
    <line x1="98" y1="22" x2="79" y2="41"/><line x1="41" y1="79" x2="22" y2="98"/>
  </svg>`;
  d.style.left=x+'px'; d.style.top=y+'px';
  fx.append(d);
  setTimeout(()=>d.remove(),360);

  for(let i=0;i<7;i++){
    const p=document.createElement('i');
    p.className='dust'+(i%2?' pk':'');
    p.style.left=x+'px'; p.style.top=y+'px';
    const a=Math.random()*Math.PI*2, r=24+Math.random()*34;
    p.style.setProperty('--dx',Math.cos(a)*r+'px');
    p.style.setProperty('--dy',(Math.sin(a)*r-16)+'px');
    fx.append(p);
    setTimeout(()=>p.remove(),580);
  }
}

/* کوین پرنده بالای نقطه‌ی ضربه */
function coinFly(x,y){
  const d=document.createElement('div');
  d.className='coinFly';
  d.innerHTML=COIN_SVG+'<span>+۱</span>';
  d.style.left=x+'px'; d.style.top=y+'px';
  fx.append(d);
  setTimeout(()=>d.remove(),820);
}

/* اگه عکس بکگراند نبود */
 $('#bg').addEventListener('error',()=>{ stage.classList.add('noimg'); $('#imgNote').hidden=false; });
</script>
</body>
</html>
